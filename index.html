const cats=['Todos',...new Set(products.map(p=>p.cat))];let active='Todos';const grid=document.getElementById('grid'),filters=document.getElementById('filters'),search=document.getElementById('search');
function renderFilters(){filters.innerHTML=cats.map(c=>`<button class="${c===active?'active':''}" onclick="active='${c}';renderFilters();render()">${c}</button>`).join('')}
function render(){const q=search.value.toLowerCase().trim();const list=products.filter(p=>(active==='Todos'||p.cat===active)&&(!q||p.name.toLowerCase().includes(q)||p.code.includes(q)));grid.innerHTML=list.length?list.map(p=>`<article class='card'><div class='photo'>${p.img?`<img loading='lazy' src='${encodeURI(p.img)}' alt='${p.name}'>`:`<div class='placeholder'>IMAGEN<br>PRÓXIMAMENTE</div>`}</div><div class='info'><div class='cat'>${p.cat}</div><div class='name'>${p.name}</div><div class='code'>${p.code?'Código: '+p.code:'Código no disponible'}</div><div class='price'>L ${p.price.toFixed(2)}</div><div class='wholesale'>Precio mayoreo · mínimo 3 unidades</div><a class='order' target='_blank' rel='noopener' href="https://wa.me/50487307101?text=${encodeURIComponent(`Hola, quiero pedir ${p.name}${p.code ? `, código ${p.code}` : ''}. Precio mayoreo: L ${p.price.toFixed(2)} (mínimo 3 unidades). ¿Está disponible?`)}">PEDIR POR WHATSAPP</a></div></article>`).join(''):`<div class='empty'>No encontramos productos con esa búsqueda.</div>`}
search.addEventListener('input',render);renderFilters();render();
</script></body></html>
